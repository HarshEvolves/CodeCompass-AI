# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, executed before the env.py file.
prepend_syspath = .

# timezone to use when rendering the date within the migration file as
# well as the filename.
# timezone =

# max length of characters to use for "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded that are relative to the
# project directory
# sourceless = false

# version location specification; This defaults to alembic/versions.
# When using multiple version directories, paths must be separated by
# spaces, e.g. version_locations = %(here)s/bar %(here)s/bat
# version_locations = %(here)s/alembic/versions

# version_path_separator is the character used to split
# version_locations. The default within new projects is 'space',
# but 'os' can also be used.
# version_path_separator = ' '

# Note: The database URL is configured dynamically in env.py from settings,
# so the line below is just a fallback.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/replayiq


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts. See the documentation for details.


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
